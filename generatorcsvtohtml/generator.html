<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Générateur de HTML depuis Word</title>
</head>
<body>
  <h1>Convertisseur DOCX vers HTML Berner</h1>
  <input type="file" id="fileInput" accept=".docx" />
  <button onclick="convertDocx()">Convertir en HTML</button>

  <h2>Code HTML généré :</h2>
  <textarea id="output" rows="30" style="width:100%"></textarea>

  <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
  <script>
    const introStyle = `
<style>
.container-introduction-sitemap-page{
    color:black;
    max-width: 1094px;
    padding: 25px;
    margin: auto;
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    flex-direction: row;
}
.container-introduction-sitemap-page p {
    font-size:1.2em;
    width:100%;
    text-align:justify;
    padding:15px;
}
.container-introduction-sitemap-page .intro-seo{
    width:100%;
    border-radius:25%;
    padding:15px;
    display:block;
}
@media only screen and (max-width: 750px) {
    .container-introduction-sitemap-page {
        max-width: 990px;
        padding: 20px;
        margin: auto;
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
    }
    .container-introduction-sitemap-page .intro-seo{
        width:100%;
        border-radius:25%;
        padding:5px;
        display:block;
    }
}
</style>`;

    const contentStyle = `
<style>
.container-seo{
    color:black;
}
@media only screen and (max-width: 990px){
    .container-seo{
        width:90%;
        margin:auto;
        padding:5px;
    }
    .text-seo{
        text-align:left!important;
        padding:10px!important;
    }
    .titre-seo{
        text-align:left!important;
        padding:10px!important;
    }
}
@media only screen and (min-width: 991px){
    .container-seo{
        width:80%;
        margin: auto;
        padding: 20px;
    }
    .text-seo{
        text-align:left!important;
        padding:15px;
    }
}
.titre-seo{
    font-family: 'Archivo', Verdana, Arial, sans-serif;
    font-size: 26px;
    line-height: 31px;
    font-weight: bold;
    color: #000;
    padding:15px;
}
.titre-seo span{
    color:#97c1de;
}
.container-seo li{
    padding: 10px;
    width:100%;
}
</style>`;

    function convertDocx() {
      const file = document.getElementById("fileInput").files[0];
      if (!file) return alert("Merci de sélectionner un fichier .docx");

      mammoth.convertToHtml({ arrayBuffer: file })
        .then(result => {
          let html = result.value;
          let parser = new DOMParser();
          let doc = parser.parseFromString(html, 'text/html');
          let paragraphs = [...doc.body.querySelectorAll('p')];

          // Ignore premier paragraphe s'il y en a au moins 2 sous h1
          if (doc.querySelector('h1')) {
            let h1Index = paragraphs.findIndex(p => p.textContent.includes(doc.querySelector('h1').textContent));
            if (h1Index >= 0 && paragraphs.length > h1Index + 2) {
              paragraphs.splice(h1Index + 1, 1); // retire le paragraphe juste après h1
            }
            doc.querySelector('h1').remove(); // supprimer le H1
          }

          // Génère le contenu HTML
          let firstParagraph = paragraphs.shift()?.outerHTML || "";
          let intro = `
${introStyle}
<div class="container-introduction-sitemap-page">
  <div class="intro-seo">
    ${firstParagraph}
  </div>
</div>`;

          let seo = `
${contentStyle}
<div class="container-seo">
`;

          paragraphs.forEach(p => {
            if (p.querySelector('strong') && p.textContent.trim().endsWith('?')) {
              seo += `<h2 class="titre-seo">${p.innerHTML}</h2>\n`;
            } else {
              seo += `<p class="text-seo">${p.innerHTML}</p>\n`;
            }
          });

          seo += "</div>";

          document.getElementById("output").value = intro + "\n\n" + seo;
        })
        .catch(err => {
          alert("Erreur lors de la lecture du fichier : " + err.message);
        });
    }
  </script>
</body>
</html>
