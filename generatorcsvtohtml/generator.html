<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Générateur HTML depuis DOCX</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 1000px; margin: 0 auto; }
        h1, h2 { color: #A9D1E8; }
        .input-section { background: #000; padding: 20px; border-radius: 5px; margin-bottom: 20px; }
        textarea { width: 100%; height: 200px; margin: 15px 0; padding: 10px; font-size: 14px; border-radius: 4px; border: 1px solid #ddd; }
        button { padding: 10px 15px; font-size: 16px; background: #F26522; color: white; border: none; border-radius: 4px; cursor: pointer; margin-right: 10px; }
        button:hover { background: #45a049; }
        .output-section { margin-top: 30px; }
        .output-area { background: #f5f5f5; padding: 15px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 20px; }
        .output-header { font-weight: bold; margin-bottom: 10px; }
        .info-text { color: #666; font-style: italic; margin-bottom: 10px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
</head>
<body>
    <h1>Générateur HTML depuis DOCX avec séparation de modèles</h1>
    
    <div class="input-section">
        <h2>Importer votre fichier DOCX</h2>
        <p class="info-text">Utilisez <strong>{changeTemplate}</strong> dans votre document pour séparer la partie introduction et la partie détails SEO.</p>
        <input type="file" id="uploadDoc" accept=".docx" />
        <button id="generateBtn" onclick="generateHTML()">Générer HTML</button>
    </div>
    
    <div class="output-section">
        <div class="output-area">
            <div class="output-header">Partie 1 (Introduction)</div>
            <textarea id="outputPart1" readonly></textarea>
            <button onclick="downloadHtml('part1.html', document.getElementById('outputPart1').value)">Télécharger Partie 1</button>
            <button onclick="copyToClipboard('outputPart1')">Copier</button>
        </div>
        
        <div class="output-area">
            <div class="output-header">Partie 2 (Détails SEO)</div>
            <textarea id="outputPart2" readonly></textarea>
            <button onclick="downloadHtml('part2.html', document.getElementById('outputPart2').value)">Télécharger Partie 2</button>
            <button onclick="copyToClipboard('outputPart2')">Copier</button>
        </div>
    </div>

    <script>
        // Templates CSS pour chaque partie
        const templatePart1 = `
<style>
.container-introduction-sitemap-page{ color:black; max-width: 1094px; padding: 25px; margin: auto; display: flex; justify-content: space-around; flex-wrap: wrap; flex-direction: row; }
.container-introduction-sitemap-page p { font-size:1.2em; width:100%; text-align:justify; padding:15px; }
.container-introduction-sitemap-page .intro-seo{ width:100%; border-radius:25%; padding:15px; display:block; }
@media only screen and (max-width: 750px) { .container-introduction-sitemap-page { max-width: 990px; padding: 20px; margin: auto; display: flex; flex-direction: column; flex-wrap: wrap; } .container-introduction-sitemap-page .intro-seo{ padding:5px; } }
</style>
<div class="container-introduction-sitemap-page">
    <div class="intro-seo">`;

        const templatePart2 = `
<style>
.container-seo { color: black; }
@media only screen and (max-width: 990px) { .container-seo { width: 90%; margin: auto; padding: 5px; } .text-seo { text-align: left!important; padding: 10px!important; } .titre-seo { text-align: left!important; padding: 10px!important; } }
@media only screen and (min-width: 991px) { .container-seo { width: 80%; margin: auto; padding: 20px; } .text-seo { text-align: left!important; padding: 15px; } }
.titre-seo { font-family: 'Archivo', Verdana, Arial, sans-serif; font-size: 26px; line-height: 31px; font-weight: bold; color: #000; padding: 15px;text-transform: uppercase; }
.titre-seo span { color: #97c1de; }
.container-seo li { padding: 10px; width:100%; }
</style>
<div class="container-seo">`;

        const closingPart1 = `</div></div>`;
        const closingPart2 = `</div>`;

        // Fonction pour générer le HTML
        function generateHTML() {
            const file = document.getElementById('uploadDoc').files[0];
            if (!file) {
                alert("Veuillez sélectionner un fichier DOCX");
                return;
            }
            
            const reader = new FileReader();

            reader.onload = function(event) {
                mammoth.convertToHtml({ arrayBuffer: event.target.result }).then(function(result) {
                    const htmlContent = result.value;
                    
                    // Chercher le marqueur {changeTemplate}
                    const parts = htmlContent.split('{changeTemplate}');
                    
                    if (parts.length < 2) {
                        alert("Le marqueur {changeTemplate} n'a pas été trouvé dans le document. Assurez-vous de l'inclure pour séparer les deux parties.");
                        return;
                    }
                    
                    // Formater la partie 1
                    let htmlPart1 = parts[0].trim();
                    const fullHtmlPart1 = templatePart1 + htmlPart1 + closingPart1;
                    
                    // Formater la partie 2
                    let htmlPart2 = parts[1].trim();
                    // Ajouter la classe 'titre-seo' aux balises <h2>
                    htmlPart2 = htmlPart2.replace(/<h2>/g, '<h2 class="titre-seo">');
                    const fullHtmlPart2 = templatePart2 + htmlPart2 + closingPart2;
                    
                    // Afficher dans les textareas
                    document.getElementById("outputPart1").value = fullHtmlPart1;
                    document.getElementById("outputPart2").value = fullHtmlPart2;
                });
            };

            reader.readAsArrayBuffer(file);
        }

        // Fonction pour télécharger le fichier HTML généré
        function downloadHtml(filename, content) {
            const blob = new Blob([content], { type: 'text/html' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
        }
        
        // Fonction pour copier le contenu dans le presse-papier
        function copyToClipboard(elementId) {
            const textarea = document.getElementById(elementId);
            textarea.select();
            document.execCommand('copy');
            alert('Contenu copié dans le presse-papier !');
        }
    </script>
</body>
</html>
