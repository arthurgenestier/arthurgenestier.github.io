<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Générateur HTML CMS</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
    textarea { width: 100%; height: 250px; margin: 15px 0; padding: 10px; font-size: 14px; }
    button { padding: 10px 20px; font-size: 16px; }
    .output-area { background: #fff; border: 1px solid #ccc; }
    label { font-weight: bold; display: block; margin-top: 20px; }
  </style>
</head>
<body>

  <h2>Convertisseur de contenu CMS</h2>

  <label for="rawInput">Collez ici le contenu brut :</label>
  <textarea id="rawInput" placeholder="Collez ici votre texte Word ou autre..."></textarea>

  <button onclick="convert()">Générer le HTML</button>

  <label for="htmlPart1">🔹 Partie 1 : avant la {COUPURE}</label>
  <textarea id="htmlPart1" class="output-area" readonly></textarea>

  <label for="htmlPart2">🔸 Partie 2 : après la {COUPURE}</label>
  <textarea id="htmlPart2" class="output-area" readonly></textarea>

  <script>
    function convert() {
      let content = document.getElementById("rawInput").value;

      // Nettoyage léger (préserve le texte brut)
      let safeContent = content.replace(/berner/gi, "BERNER");

      // Crée une division (manuelle) selon un séparateur s'il y en a, sinon coupe au milieu
      const split = Math.floor(safeContent.length / 2);
      let part1 = safeContent.slice(0, split);
      let part2 = safeContent.slice(split);

      // Templates CMS
      const template1 = `
<style>
.container-introduction-sitemap-page{
    color:black; max-width: 1094px; padding: 25px; margin: auto;
    display: flex; justify-content: space-around; flex-wrap: wrap; flex-direction: row;
}
.container-introduction-sitemap-page p {
    font-size:1.2em; width:100%; text-align:justify; padding:15px;
}
.container-introduction-sitemap-page .intro-seo{
    width:100%; border-radius:25%; padding:15px; display:block;
}
@media only screen and (max-width: 750px) {
    .container-introduction-sitemap-page { max-width: 990px; padding: 20px; flex-direction: column; }
    .container-introduction-sitemap-page .intro-seo{ padding:5px; }
}
</style>
<div class="container-introduction-sitemap-page">
    <div class="intro-seo">
        <p>${part1}</p>
    </div>
</div>`;

      const template2 = `
<style>
.container-seo{ color:black; }
@media only screen and (max-width: 990px){
    .container-seo{ width:90%; margin:auto; padding:5px; }
    .text-seo{ text-align:left!important; padding:10px!important; }
    .titre-seo{ text-align:left!important; padding:10px!important; }
}
@media only screen and (min-width: 991px){
    .container-seo{ width:80%; margin: auto; padding: 20px; }
    .text-seo{ text-align:left!important; padding:15px; }
}
.titre-seo{
    font-family: 'Archivo', Verdana, Arial, sans-serif;
    font-size: 26px; line-height: 31px;
    font-weight: bold; color: #000; padding:15px;
}
.titre-seo span{ color:#97c1de; }
.container-seo li{ padding: 10px; width:100%; }
</style>
<div class="container-seo">
    <p class="text-seo">${part2}</p>
</div>`;

      document.getElementById("htmlPart1").value = template1.trim();
      document.getElementById("htmlPart2").value = template2.trim();
    }
  </script>
</body>
</html>
