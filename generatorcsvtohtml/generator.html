<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Convertisseur DOCX vers HTML CMS</title>
    <script src="https://unpkg.com/mammoth/mammoth.browser.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        textarea { width: 100%; height: 300px; margin-top: 20px; }
    </style>
</head>
<body>
    <h2>Convertisseur DOCX vers HTML CMS</h2>
    <input type="file" id="upload" accept=".docx" />
    <button onclick="clearOutput()">🧹 Vider</button>

    <textarea id="output" placeholder="Le code HTML généré apparaîtra ici..."></textarea>

    <script>
        const templateDebut = `
<style>
.container-introduction-sitemap-page{
    color:black;
    max-width: 1094px;
    padding: 25px;
    margin: auto;
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    flex-direction: row;
}
.container-introduction-sitemap-page p {
    font-size:1.2em;
    width:100%;
    text-align:justify;
    padding:15px;
}
.container-introduction-sitemap-page .intro-seo{
    width:100%;
    border-radius:25%;
    padding:15px;
    display:block;
}
@media only screen and (max-width: 750px) {
    .container-introduction-sitemap-page {
        max-width: 990px;
        padding: 20px;
        margin: auto;
        display: flex;
        flex-direction: column;
        flex-wrap: wrap;
    }
    .container-introduction-sitemap-page .intro-seo{
        width:100%;
        border-radius:25%;
        padding:5px;
        display:block;
    }
}
</style>
<div class="container-introduction-sitemap-page">
    <div class="intro-seo">
`;

const templateFin = `
    </div>
</div>
{COUPURE}
<style>
.container-seo{ color:black; }
@media only screen and (max-width: 990px){
    .container-seo{ width:90%; margin:auto; padding:5px; }
    .text-seo{ text-align:left!important; padding:10px!important; }
    .titre-seo{ text-align:left!important; padding:10px!important; }
}
@media only screen and (min-width: 991px){
    .container-seo{ width:80%; margin: auto; padding: 20px; }
    .text-seo{ text-align:left!important; padding:15px; }
}
.titre-seo{
    font-family: 'Archivo', Verdana, Arial, sans-serif;
    font-size: 26px;
    line-height: 31px;
    font-weight: bold;
    color: #000;
    padding:15px;
}
.titre-seo span{ color:#97c1de; }
.container-seo li{ padding: 10px; width:100%; }
</style>
<div class="container-seo">
<!-- Ajoute ici le reste du contenu après la coupure -->
</div>
`;

        document.getElementById('upload').addEventListener('change', function(event) {
            const reader = new FileReader();
            reader.onload = function(event) {
                mammoth.convertToHtml({arrayBuffer: event.target.result}, {
                    styleMap: ["b => strong"]
                }).then(function(result) {
                    let html = result.value;

                    // Réinjection du lien si besoin (exemple pour "rondelles de calages et paumelles")
                    html = html.replace(/(rondelles? de calages? et paumelles?)/gi, `<a href="https://shop.berner.eu/fr-fr/dsc/43681901-rondelle-de-calage-et-paumelle/">$1</a>`);

                    // S'assurer que BERNER est toujours en majuscule
                    html = html.replace(/berner/gi, "BERNER");

                    // Affichage dans le template
                    document.getElementById('output').value = templateDebut + html + templateFin;
                });
            };
            reader.readAsArrayBuffer(this.files[0]);
        });

        function clearOutput() {
            document.getElementById('output').value = "";
        }
    </script>
</body>
</html>
