<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Générateur CMS HTML</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f0f0f0; }
    textarea { width: 100%; height: 200px; margin-bottom: 15px; padding: 10px; font-size: 14px; }
    .output { background: #fff; border: 1px solid #ccc; padding: 10px; height: 250px; overflow-y: auto; white-space: pre-wrap; }
    button { padding: 10px 15px; font-size: 14px; margin-bottom: 20px; }
    h2 { margin-top: 30px; }
  </style>
</head>
<body>

  <h1>🛠 Générateur de blocs HTML CMS</h1>

  <h2>🔹 Partie 1 (avant {COUPURE})</h2>
  <textarea id="input1" placeholder="Collez ici le texte de la première partie..."></textarea>
  <button onclick="generatePart1()">Générer HTML Partie 1</button>
  <div class="output" id="output1"></div>

  <h2>🔸 Partie 2 (après {COUPURE})</h2>
  <textarea id="input2" placeholder="Collez ici le texte de la deuxième partie..."></textarea>
  <button onclick="generatePart2()">Générer HTML Partie 2</button>
  <div class="output" id="output2"></div>

  <script>
    function generatePart1() {
      const text = document.getElementById("input1").value;
      const html = `
<style>
.container-introduction-sitemap-page{
    color:black; max-width: 1094px; padding: 25px; margin: auto;
    display: flex; justify-content: space-around; flex-wrap: wrap; flex-direction: row;
}
.container-introduction-sitemap-page p {
    font-size:1.2em; width:100%; text-align:justify; padding:15px;
}
.container-introduction-sitemap-page .intro-seo{
    width:100%; border-radius:25%; padding:15px; display:block;
}
@media only screen and (max-width: 750px) {
    .container-introduction-sitemap-page {
        max-width: 990px; padding: 20px; flex-direction: column;
    }
    .container-introduction-sitemap-page .intro-seo{ padding:5px; }
}
</style>
<div class="container-introduction-sitemap-page">
  <div class="intro-seo">
    <p>${text}</p>
  </div>
</div>`.trim();
      document.getElementById("output1").innerText = html;
    }

    function generatePart2() {
      let text = document.getElementById("input2").value;

      // Transformation des puces (•) en listes
      const lines = text.split('\n');
      let formatted = '';
      let inList = false;

      for (let line of lines) {
        if (line.trim().startsWith('•')) {
          if (!inList) {
            formatted += '<ul>\n';
            inList = true;
          }
          const item = line.replace(/^•\s*/, '').trim();
          formatted += `<li>${item}</li>\n`;
        } else {
          if (inList) {
            formatted += '</ul>\n';
            inList = false;
          }
          formatted += line + '\n';
        }
      }
      if (inList) formatted += '</ul>\n';

      const html = `
<style>
.container-seo{ color:black; }
@media only screen and (max-width: 990px){
  .container-seo{ width:90%; margin:auto; padding:5px; }
  .text-seo{ text-align:left!important; padding:10px!important; }
  .titre-seo{ text-align:left!important; padding:10px!important; }
}
@media only screen and (min-width: 991px){
  .container-seo{ width:80%; margin: auto; padding: 20px; }
  .text-seo{ text-align:left!important; padding:15px; }
}
.titre-seo{
  font-family: 'Archivo', Verdana, Arial, sans-serif;
  font-size: 26px; line-height: 31px;
  font-weight: bold; color: #000; padding:15px;
}
.titre-seo span{ color:#97c1de; }
.container-seo li{ padding: 10px; width:100%; }
</style>
<div class="container-seo">
  ${formatted.trim()}
</div>`.trim();

      document.getElementById("output2").innerText = html;
    }
  </script>
</body>
</html>
